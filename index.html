<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Баклажан</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
font-family:'Inter',sans-serif;
background:#050816;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow-x:hidden;
position:relative;
}
body::before{
content:"";
position:fixed;
top:-250px;left:-250px;
width:700px;height:700px;
background:#7c3aed;
filter:blur(180px);
opacity:.22;
animation:move1 14s ease-in-out infinite;
}
body::after{
content:"";
position:fixed;
bottom:-250px;right:-250px;
width:700px;height:700px;
background:#14b8a6;
filter:blur(180px);
opacity:.18;
animation:move2 16s ease-in-out infinite;
}
@keyframes move1{0%,100%{transform:translate(0,0);}50%{transform:translate(120px,80px);}}
@keyframes move2{0%,100%{transform:translate(0,0);}50%{transform:translate(-120px,-80px);}}
.wrapper{width:100%;max-width:760px;position:relative;z-index:2;}
.panel{
background:rgba(255,255,255,.04);
backdrop-filter:blur(40px);
border:1px solid rgba(255,255,255,.08);
border-radius:32px;
padding:40px;
box-shadow:0 30px 80px rgba(0,0,0,.35);
}
.logo{
display:block;
width:600px;
max-width:95%;
margin:0 auto 35px auto;
filter:drop-shadow(0 0 50px rgba(124,58,237,.25)) drop-shadow(0 0 100px rgba(20,184,166,.15));
}
.buttons{display:flex;flex-direction:column;gap:16px;}
.btn{
display:flex;
align-items:center;
justify-content:center;
height:72px;
text-decoration:none;
color:#fff;
font-size:18px;
font-weight:600;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
transition:.3s;
position:relative;
overflow:hidden;
}
.btn::before{
content:"";
position:absolute;
left:-100%;
top:0;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
transition:.8s;
}
.btn:hover::before{left:100%;}
.btn:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.08);
box-shadow:0 0 30px rgba(124,58,237,.25),0 0 60px rgba(20,184,166,.15);
}
@media(max-width:768px){
.panel{padding:24px;}
.logo{width:320px;margin-bottom:25px;}
.btn{height:62px;font-size:16px;}
}
</style>
</head>
<body>
<div class="wrapper">
<div class="panel">
<img src="logo.png" alt="Баклажан" class="logo">
<div class="buttons">
<a href="https://vk.cc/cYqK9G" target="_blank" class="btn">
Видеоинструкция по юнит-экономике
</a>
<a href="https://vk.cc/cYqKfM" target="_blank" class="btn">
Шаблон юнит-экономики
</a>
</div>
</div>
</div>
</body>
</html>
