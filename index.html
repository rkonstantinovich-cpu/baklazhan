<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Баклажан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,sans-serif;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow:hidden;
position:relative;
}
body:before,body:after{
content:"";
position:fixed;
width:700px;height:700px;
filter:blur(180px);
z-index:0;
}
body:before{top:-250px;left:-250px;background:#7c3aed;opacity:.22;}
body:after{right:-250px;bottom:-250px;background:#14b8a6;opacity:.18;}
.panel{
position:relative;
z-index:1;
max-width:760px;
width:100%;
padding:40px;
border-radius:32px;
background:rgba(255,255,255,.04);
backdrop-filter:blur(40px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 30px 80px rgba(0,0,0,.35);
}
.logo{
display:block;
width:600px;
max-width:95%;
margin:0 auto 35px;
}
.buttons{display:flex;flex-direction:column;gap:16px}
.btn{
display:flex;
align-items:center;
justify-content:center;
height:72px;
border-radius:18px;
text-decoration:none;
font-weight:600;
font-size:18px;
color:#fff;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
transition:.3s;
}
.btn:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.08);
}
@media(max-width:768px){
.panel{padding:24px}
.logo{width:320px}
.btn{height:62px;font-size:16px}
}
</style>
</head>
<body>
<div class="panel">
<img src="logo.png" class="logo" alt="Баклажан">
<div class="buttons">
<a class="btn" target="_blank" href="https://vk.cc/cYqK9G">Видеоинструкция по юнит-экономике</a>
<a class="btn" target="_blank" href="https://vk.cc/cYqKfM">Шаблон юнит-экономики</a>
</div>
</div>
</body>
</html>
